name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain version
        run: swift --version && sw_vers
      - name: Engine tests
        run: swift test
      - name: App bundle (universal)
        run: ./scripts/build-app.sh universal
      - name: Verify bundle
        run: |
          plutil -lint build/Genesis.app/Contents/Info.plist
          lipo -info build/Genesis.app/Contents/MacOS/Genesis
          codesign --verify --verbose build/Genesis.app
      - name: Launch smoke test and screenshot
        run: |
          open build/Genesis.app
          sleep 12
          pgrep -x Genesis
          screencapture -x screenshot.png || true
          pkill -x Genesis || true
      - uses: actions/upload-artifact@v4
        with:
          name: screenshot
          path: screenshot.png
          if-no-files-found: ignore
      - name: Zip
        run: ditto -c -k --keepParent build/Genesis.app Genesis.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Genesis-macOS
          path: Genesis.zip
